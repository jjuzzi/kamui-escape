name: Build IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build KAMUI IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build IPA
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK="$SDK_PATH" ./build.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KAMUI-IPA
          path: build/*.ipa
          if-no-files-found: error
